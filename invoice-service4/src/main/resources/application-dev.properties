
# APPLICATION
spring.application.name=invoice-service4

# SERVER
server.port=8081

# MYSQL DATABASE
spring.datasource.url=jdbc:mysql://localhost:3306/order_service_db
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# UPSTASH REDIS
spring.data.redis.host=arriving-dingo-185506.upstash.io
spring.data.redis.port=6379
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.cache.type=redis

# EUREKA SERVICE DISCOVERY
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5

# Prefer the registered IP address only if it is reachable by the other services.
eureka.instance.prefer-ip-address=true

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics,beans,mappings,env,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true

# DISTRIBUTED TRACING
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# OPENFEIGN OBSERVABILITY
spring.cloud.openfeign.micrometer.enabled=true

# LOGGING
logging.pattern.correlation=[${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]
logging.include-application-name=false
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# APPLICATION INFORMATION
info.app.name=invoice-service4
info.app.version=1.0
info.app.description=Java Backend Application
